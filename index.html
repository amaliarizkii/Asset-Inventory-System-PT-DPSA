<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PT DPSA - Asset & Inventory System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 text-slate-800 antialiased h-screen w-screen overflow-hidden font-sans select-none">

  <!-- Container Utama Aplikasi -->
  <div id="appContainer" style="display: none;" class="h-full w-full overflow-hidden flex relative">
    
    <!-- Backdrop Blur saat Sidebar Terbuka di HP (Persis Gemini) -->
    <div id="sidebarBackdrop" onclick="toggleSidebar(false)" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-30 transition-opacity duration-300 opacity-0 pointer-events-none md:hidden"></div>

    <!-- Sidebar (Model Gemini: Bisa Dihidden Penuh dan Masuk Mulus) -->
    <aside id="mainSidebar" class="fixed md:static inset-y-0 left-0 w-64 bg-slate-900 text-slate-300 flex flex-col justify-between shrink-0 border-r border-slate-800 h-full transition-transform duration-300 ease-in-out z-40 -translate-x-full md:translate-x-0 select-none shadow-2xl md:shadow-none">
      
      <!-- Bagian Atas Sidebar -->
      <div class="flex flex-col flex-1 min-h-0 overflow-hidden">
        <!-- Logo & Header -->
        <div class="h-16 flex items-center justify-between px-4 border-b border-slate-800/80 gap-3 shrink-0">
          <div class="flex items-center gap-2.5">
            <img src="logo dpsa.png" alt="PT DPSA" class="w-8 h-8 object-contain shrink-0" onerror="this.src='no image.png'">
            <div class="whitespace-nowrap overflow-hidden">
              <h1 class="text-sm font-black text-white tracking-wider leading-none">PT DPSA</h1>
              <p class="text-[9px] text-sky-400 font-semibold tracking-wide uppercase mt-0.5">Asset & Inventory</p>
            </div>
          </div>
          <!-- Tombol Tutup Sidebar di HP -->
          <button onclick="toggleSidebar(false)" class="p-1.5 rounded-lg text-slate-400 hover:text-white md:hidden cursor-pointer" title="Tutup Menu">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
        
        <!-- Status Sheets Terhubung -->
        <div class="px-4 py-2 border-b border-slate-800/50 bg-slate-950/40 shrink-0">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400 shrink-0 animate-pulse"></span>
            <span class="text-[9px] text-emerald-300 font-bold whitespace-nowrap">Sheets Terhubung</span>
          </div>
        </div>
        
        <!-- Menu Navigasi (Rata Kiri, Ikon & Teks Berdampingan, Tanpa Penomoran) -->
        <nav class="p-2.5 space-y-1 flex-1 overflow-y-auto">
          <p class="px-3 py-1 text-[9px] font-extrabold uppercase tracking-wider text-slate-400">Navigasi Utama</p>
          
          <!-- Menu Overview -->
          <button type="button" onclick="switchTab('overview'); onMobileNavClick();" id="nav-overview" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-semibold transition text-white bg-blue-600 shadow-sm shadow-blue-900/40 cursor-pointer text-left" title="Overview">
            <div class="flex items-center gap-2.5">
              <i data-lucide="layout-dashboard" class="w-4 h-4 shrink-0"></i>
              <span class="font-medium whitespace-nowrap">Overview</span>
            </div>
          </button>
          
          <!-- Menu Fix Asset -->
          <button type="button" onclick="switchTab('fixasset'); onMobileNavClick();" id="nav-fixasset" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800/80 transition cursor-pointer text-left" title="Fix Asset">
            <div class="flex items-center gap-2.5 min-w-0">
              <i data-lucide="building-2" class="w-4 h-4 shrink-0"></i>
              <span class="font-medium whitespace-nowrap">Fix Asset</span>
            </div>
            <span id="badgeCountFixAsset" class="px-1.5 py-0.5 text-[10px] font-bold rounded-full bg-slate-800 text-sky-400 shrink-0">0</span>
          </button>
          
          <!-- Menu Inventory -->
          <button type="button" onclick="switchTab('inventory'); onMobileNavClick();" id="nav-inventory" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800/80 transition cursor-pointer text-left" title="Inventory">
            <div class="flex items-center gap-2.5 min-w-0">
              <i data-lucide="boxes" class="w-4 h-4 shrink-0"></i>
              <span class="font-medium whitespace-nowrap">Inventory</span>
            </div>
            <span id="badgeCountInventory" class="px-1.5 py-0.5 text-[10px] font-bold rounded-full bg-slate-800 text-emerald-400 shrink-0">0</span>
          </button>
        </nav>
      </div>

      <!-- Bagian Bawah: Profil Pengguna -->
      <div class="p-2.5 border-t border-slate-800/80 shrink-0">
        <div class="bg-slate-800/60 p-2 rounded-xl flex items-center justify-between border border-slate-700/50">
          <div class="flex items-center gap-2 min-w-0">
            <div id="userAvatarInitials" class="w-8 h-8 rounded-lg bg-sky-500/20 text-sky-400 flex items-center justify-center font-bold text-xs border border-sky-400/30 shrink-0">
              IT
            </div>
            <div class="min-w-0 overflow-hidden">
              <p id="userProfileName" class="text-xs font-bold text-white truncate leading-none">Staff IT</p>
              <p id="userProfileRole" class="text-[9px] text-slate-400 truncate mt-0.5">IT Support</p>
            </div>
          </div>
          <button onclick="logout()" title="Keluar Akun" class="text-slate-400 hover:text-rose-400 transition p-1 cursor-pointer">
            <i data-lucide="log-out" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Workspace (Desktop & HP Fit Compact) -->
    <main class="flex-1 flex flex-col h-full min-w-0 overflow-hidden bg-slate-100">
      
      <!-- Header Atas (Tinggi Lebih Ringkas h-14) -->
      <header class="h-14 bg-white border-b border-slate-200/90 px-3.5 sm:px-6 flex items-center justify-between shrink-0 z-20 shadow-xs">
        <div class="flex items-center gap-2.5">
          <!-- Tombol Toggle Sidebar (Gaya Gemini) -->
          <button onclick="toggleSidebar()" id="sidebarToggleBtn" class="p-2 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition cursor-pointer" title="Buka / Sembunyikan Sidebar">
            <i data-lucide="panel-left" id="sidebarToggleIcon" class="w-4 h-4"></i>
          </button>
          <div>
            <h2 id="topBarTitle" class="text-sm sm:text-base font-black text-slate-900 tracking-tight leading-none">Overview</h2>
            <p id="topBarSubtitle" class="text-[10px] text-slate-500 font-medium hidden sm:block mt-0.5">PT DPSA Asset & Inventory Portal</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="initData()" class="p-2 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 transition cursor-pointer" title="Refresh Data Spreadsheet">
            <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </header>

      <!-- Scrollable Content Container (Padding & Spasi Lebih Fit) -->
      <div class="flex-1 overflow-y-auto p-3 sm:p-5 space-y-4">
        
        <!-- SECTION 1: OVERVIEW -->
