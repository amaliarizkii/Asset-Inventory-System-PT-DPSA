<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasil Verifikasi Aset - PT DPSA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0b1a3d] min-h-screen flex items-center justify-center p-3 sm:p-6 md:p-10 font-sans antialiased selection:bg-sky-500 selection:text-white">
  
  <!-- Loader Mini Floating -->
  <div id="barcodeLoader" class="fixed top-4 left-1/2 -translate-x-1/2 bg-blue-600/90 text-white px-4 py-2 rounded-full text-xs font-semibold shadow-lg z-50 flex items-center gap-2 backdrop-blur-sm">
    <svg class="animate-spin h-3.5 w-3.5 text-white" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
    <span>Memuat data resmi...</span>
  </div>

  <!-- KARTU PASPOR IDENTIK DENGAN FOTO REFERENSI -->
  <div class="w-full max-w-4xl bg-white rounded-[28px] sm:rounded-[36px] shadow-2xl p-6 sm:p-10 relative overflow-hidden border border-slate-100/30">
    
    <!-- HEADER PILL (Logo DPSA + Teks) -->
    <div class="bg-[#dbeefd] rounded-full max-w-xl mx-auto py-2.5 px-6 sm:px-8 flex items-center justify-center gap-4 shadow-sm mb-8 border border-sky-200/70">
      <img src="logo dpsa.png" alt="PT DPSA Logo" class="w-11 h-11 sm:w-12 sm:h-12 object-contain" onerror="this.onerror=null;this.src='no image.png';">
      <div class="text-left">
        <h2 class="text-2xl sm:text-3xl font-black tracking-wider uppercase leading-none" style="color: #1a2f64;">PT DPSA</h2>
        <p class="text-xs sm:text-sm font-semibold tracking-normal mt-0.5" style="color: #1e3a8a;">Asset &amp; Inventory System</p>
      </div>
    </div>

    <!-- 2-COLUMN BODY -->
    <div class="grid grid-cols-1 md:grid-cols-12 gap-6 sm:gap-10 items-stretch">
      
      <!-- KOLOM KIRI (7 Atribut dengan Ikon Cyan & Garis Putus-putus) -->
      <div class="md:col-span-7 space-y-3.5">
        
        <!-- Row 1: Nama Barang -->
        <div class="pb-2.5 border-b-2 border-dashed border-[#00b0ff] flex items-center gap-3.5 sm:gap-4">
          <div class="w-11 h-11 rounded-full bg-[#e0f6ff] border-[1.5px] border-[#29b6f6] flex items-center justify-center shrink-0">
            <svg viewBox="0 0 24 24" class="w-5 h-5 text-amber-700 fill-current">
              <path d="M12 2.25L3 7.5v9l9 5.25 9-5.25v-9l-9-5.25zM12 4.6l6.6 3.85-2.6 1.52-6.6-3.85L12 4.6zm-1 5.37L4.4 6.12 11 2.27v7.7zm2 0V2.27l6.6 3.85-6.6 3.85zm-8 2.08l7 4.08v6.7l-7-4.08v-6.7zm9 10.78v-6.7l7-4.08v6.7l-7 4.08z" fill="#b45309"/>
            </svg>
          </div>
          <div>
            <p class="text-xs text-slate-500 font-medium leading-none">Nama Barang</p>
            <p id="qrNama" class="text-sm sm:text-base font-extrabold uppercase mt-1" style="color: #1a2f64;">-</p>
          </div>
        </div>

        <!-- Row 2: Kode Barang -->
        <div class="pb-2.5 border-b-2 border-dashed border-[#00b0ff] flex items-center gap-3.5 sm:gap-4">
          <div class="w-11 h-11 rounded-full bg-[#e0f6ff] border-[1.5px] border-[#29b6f6] flex items-center justify-center shrink-0">
            <svg viewBox="0 0 24 24" class="w-5 h-5">
              <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5"/>
              <circle cx="7" cy="7" r="1.5" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
            </svg>
          </div>
          <div class="min-w-0">
            <p class="text-xs text-slate-500 font-medium leading-none">Kode Barang</p>
            <p id="qrKode" class="text-xs sm:text-sm font-extrabold tracking-wider break-all mt-1 font-mono" style="color: #1a2f64;">-</p>
          </div>
        </div>

        <!-- Row 3: Tipe / Ukuran -->
        <div class="pb-2.5 border-b-2 border-dashed border-[#00b0ff] flex items-center gap-3.5 sm:gap-4">
          <div class="w-11 h-11 rounded-full bg-[#e0f6ff] border-[1.5px] border-[#29b6f6] flex items-center justify-center shrink-0">
            <svg viewBox="0 0 24 24" class="w-5 h-5">
              <rect x="2" y="3" width="20" height="14" rx="2" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
              <line x1="8" y1="21" x2="16" y2="21" stroke="#0284c7" stroke-width="2"/>
              <line x1="12" y1="17" x2="12" y2="21" stroke="#0284c7" stroke-width="2"/>
            </svg>
          </div>
          <div>
            <p class="text-xs text-slate-500 font-medium leading-none">Tipe / Ukuran</p>
            <div id="qrTipe" class="text-xs sm:text-sm font-extrabold uppercase mt-1 leading-snug" style="color: #1a2f64;">-</div>
          </div>
        </div>

        <!-- Row 4: Tahun Perolehan -->
        <div class="pb-2.5 border-b-2 border-dashed border-[#00b0ff] flex items-center gap-3.5 sm:gap-4">
          <div class="w-11 h-11 rounded-full bg-[#e0f6ff] border-[1.5px] border-[#29b6f6] flex items-center justify-center shrink-0">
            <svg viewBox="0 0 24 24" class="w-5 h-5">
              <rect x="3" y="4" width="18" height="18" rx="2" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
              <line x1="16" y1="2" x2="16" y2="6" stroke="#ef4444" stroke-width="2"/>
              <line x1="8" y1="2" x2="8" y2="6" stroke="#ef4444" stroke-width="2"/>
              <line x1="3" y1="10" x2="21" y2="10" stroke="#ef4444" stroke-width="1.5"/>
            </svg>
          </div>
          <div>
            <p class="text-xs text-slate-500 font-medium leading-none">Tahun Perolehan</p>
            <p id="qrTahun" class="text-sm sm:text-base font-extrabold uppercase mt-1" style="color: #1a2f64;">-</p>
          </div>
        </div>

        <!-- Row 5: Lokasi -->
        <div class="pb-2.5 border-b-2 border-dashed border-[#00b0ff] flex items-center gap-3.5 sm:gap-4">
          <div class="w-11 h-11 rounded-full bg-[#e0f6ff] border-[1.5px] border-[#29b6f6] flex items-center justify-center shrink-0">
            <svg viewBox="0 0 24 24" class="w-5 h-5">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#ef4444"/>
              <circle cx="12" cy="9" r="2.5" fill="#ffffff"/>
            </svg>
          </div>
          <div>
            <p class="text-xs text-slate-500 font-medium leading-none">Lokasi</p>
            <p id="qrLokasi" class="text-sm sm:text-base font-extrabold uppercase mt-1" style="color: #1a2f64;">-</p>
          </div>
        </div>

        <!-- Row 6: Keterangan -->
        <div class="pb-2.5 border-b-2 border-dashed border-[#00b0ff] flex items-center gap-3.5 sm:gap-4">
          <div class="w-11 h-11 rounded-full bg-[#e0f6ff] border-[1.5px] border-[#29b6f6] flex items-center justify-center shrink-0">
            <svg viewBox="0 0 24 24" class="w-5 h-5">
              <circle cx="12" cy="7" r="4" fill="#0284c7"/>
              <path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2" fill="#0284c7"/>
            </svg>
          </div>
          <div>
            <p class="text-xs text-slate-500 font-medium leading-none">Keterangan</p>
            <p id="qrKeterangan" class="text-sm sm:text-base font-extrabold uppercase mt-1" style="color: #1a2f64;">-</p>
          </div>
        </div>

        <!-- Row 7: Kondisi Asset -->
        <div class="pb-1 flex items-center gap-3.5 sm:gap-4">
          <div class="w-11 h-11 rounded-full bg-[#e0f6ff] border-[1.5px] border-[#29b6f6] flex items-center justify-center shrink-0">
            <svg viewBox="0 0 24 24" class="w-5 h-5">
              <rect x="5" y="4" width="14" height="17" rx="2" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
              <path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1" stroke="#b45309" stroke-width="1.5"/>
              <path d="M9 13l2 2 4-4" stroke="#16a34a" stroke-width="2"/>
            </svg>
          </div>
          <div>
            <p class="text-xs text-slate-500 font-medium leading-none">Kondisi Asset</p>
            <p id="qrKondisi" class="text-sm sm:text-base font-extrabold uppercase mt-1" style="color: #1a2f64;">-</p>
          </div>
        </div>
      </div>

      <!-- KOLOM KANAN (Frame Asset Foto & Fasad Gedung DPSA) -->
      <div class="md:col-span-5 flex flex-col justify-between items-center space-y-4">
        <div class="w-full flex flex-col items-center">
          <h3 class="text-base sm:text-lg font-black tracking-wide mb-2 text-center" style="color: #1a2f64;">Asset Foto</h3>
          
          <!-- Bingkai Foto Cyan Lengkung Tebal Sesuai Referensi -->
          <div class="w-full max-w-[280px] sm:max-w-[300px] p-1.5 rounded-[28px] border-[3.5px] border-[#00b0ff] bg-white shadow-md">
            <div class="w-full rounded-[22px] overflow-hidden bg-slate-900 min-h-[220px] max-h-[260px] flex items-center justify-center">
              <img id="qrFoto" src="no image.png" alt="Asset Foto" class="w-full h-full object-contain max-h-[260px]" onerror="this.onerror=null;this.src='no image.png';">
            </div>
          </div>
        </div>

        <!-- Fasad Gedung PT DPSA -->
        <div class="w-full max-w-[320px] pt-2">
          <div class="w-full rounded-2xl overflow-hidden shadow-sm relative bg-slate-900 flex items-end justify-center min-h-[110px]">
            <img src="building-lineart.png" alt="DPSA Building" class="w-full h-auto object-cover" onerror="this.style.display='none';">
            <img src="plant-lineart.png" alt="Flowers" class="absolute bottom-0 left-0 w-full h-auto pointer-events-none" onerror="this.style.display='none';">
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="config.js"></script>
  <script src="barcode.js"></script>
</body>
</html>
