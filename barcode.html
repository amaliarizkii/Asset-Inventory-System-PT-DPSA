<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasil Verifikasi Aset - PT DPSA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="scan-page-body">

  <div id="barcodeLoader" class="fixed top-5 left-1/2 -translate-x-1/2 bg-blue-600 text-white px-5 py-2.5 rounded-full text-xs font-bold shadow-xl z-50 flex items-center gap-2">
    <svg class="animate-spin h-4 w-4 text-white" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
    <span>Memuat data resmi PT DPSA...</span>
  </div>

  <div class="w-full max-w-4xl">
    
    <!-- Top Action -->
    <div class="flex items-center justify-between pb-3 text-white">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="text-xs font-bold tracking-wider text-sky-200 uppercase">PT DPSA • Hasil Verifikasi QR</span>
      </div>
      <div class="flex items-center gap-2">
        <a href="index.html" class="px-3.5 py-1.5 bg-white/10 hover:bg-white/20 text-white rounded-xl text-xs font-bold transition">
          Ke Dashboard &rarr;
        </a>
        <button onclick="window.print()" class="px-3.5 py-1.5 bg-sky-500 hover:bg-sky-400 text-slate-900 rounded-xl text-xs font-bold transition cursor-pointer">
          Cetak Paspor
        </button>
      </div>
    </div>

    <!-- KARTU PASPOR 100% IDENTIK PERSIS GAMBAR REFERENSI -->
    <div id="printablePassport" class="scan-card-container p-6 md:p-8 relative">
      
      <!-- HEADER PILL (Logo DPSA + Teks) -->
      <div class="scan-header-pill max-w-xl mx-auto py-2.5 px-6 flex items-center justify-center gap-4 shadow-xs mb-6">
        <img src="logo dpsa.png" alt="PT DPSA Logo" class="w-12 h-12 object-contain" onerror="this.onerror=null;this.src='no image.png';">
        <div>
          <h2 class="text-2xl md:text-3xl font-black tracking-wider uppercase leading-none" style="color: #1a2f64;">PT DPSA</h2>
          <p class="text-xs md:text-sm font-medium tracking-normal mt-0.5" style="color: #1e3a8a;">Asset & Inventory System</p>
        </div>
      </div>

      <!-- 2-COLUMN BODY -->
      <div class="grid grid-cols-1 md:grid-cols-12 gap-6 md:gap-8 items-start">
        
        <!-- KOLOM KIRI (7 Atribut dengan Ikon Sirkular Cyan & Garis Putus-putus) -->
        <div class="md:col-span-7 space-y-2.5">
          
          <!-- Row 1: Nama Barang -->
          <div class="pb-2.5 dashed-cyan-row flex items-center gap-4">
            <div class="cyan-icon-circle">
              <svg viewBox="0 0 24 24" class="w-6 h-6 text-amber-700 fill-current">
                <path d="M12 2.25L3 7.5v9l9 5.25 9-5.25v-9l-9-5.25zM12 4.6l6.6 3.85-2.6 1.52-6.6-3.85L12 4.6zm-1 5.37L4.4 6.12 11 2.27v7.7zm2 0V2.27l6.6 3.85-6.6 3.85zm-8 2.08l7 4.08v6.7l-7-4.08v-6.7zm9 10.78v-6.7l7-4.08v6.7l-7 4.08z" fill="#b45309"/>
              </svg>
            </div>
            <div>
              <p class="text-xs text-slate-600 font-medium leading-none">Nama Barang</p>
              <p id="qrNama" class="text-sm sm:text-base font-extrabold uppercase mt-1" style="color: #1a2f64;">-</p>
            </div>
          </div>

          <!-- Row 2: Kode Barang -->
          <div class="pb-2.5 dashed-cyan-row flex items-center gap-4">
            <div class="cyan-icon-circle">
              <svg viewBox="0 0 24 24" class="w-6 h-6">
                <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5"/>
                <circle cx="7" cy="7" r="1.5" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
              </svg>
            </div>
            <div class="min-w-0">
              <p class="text-xs text-slate-600 font-medium leading-none">Kode Barang</p>
              <p id="qrKode" class="text-xs sm:text-sm font-extrabold tracking-wider break-all mt-1" style="color: #1a2f64;">-</p>
            </div>
          </div>

          <!-- Row 3: Tipe / Ukuran -->
          <div class="pb-2.5 dashed-cyan-row flex items-center gap-4">
            <div class="cyan-icon-circle">
              <svg viewBox="0 0 24 24" class="w-6 h-6">
                <rect x="2" y="3" width="20" height="14" rx="2" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
                <line x1="8" y1="21" x2="16" y2="21" stroke="#0284c7" stroke-width="2"/>
                <line x1="12" y1="17" x2="12" y2="21" stroke="#0284c7" stroke-width="2"/>
              </svg>
            </div>
            <div>
              <p class="text-xs text-slate-600 font-medium leading-none">Tipe / Ukuran</p>
              <div id="qrTipe" class="text-xs sm:text-sm font-extrabold uppercase mt-1 leading-snug" style="color: #1a2f64;">-</div>
            </div>
          </div>

          <!-- Row 4: Tahun Perolehan -->
          <div class="pb-2.5 dashed-cyan-row flex items-center gap-4">
            <div class="cyan-icon-circle">
              <svg viewBox="0 0 24 24" class="w-6 h-6">
                <rect x="3" y="4" width="18" height="18" rx="2" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
                <line x1="16" y1="2" x2="16" y2="6" stroke="#ef4444" stroke-width="2"/>
                <line x1="8" y1="2" x2="8" y2="6" stroke="#ef4444" stroke-width="2"/>
                <line x1="3" y1="10" x2="21" y2="10" stroke="#ef4444" stroke-width="1.5"/>
              </svg>
            </div>
            <div>
              <p class="text-xs text-slate-600 font-medium leading-none">Tahun Perolehan</p>
              <p id="qrTahun" class="text-sm sm:text-base font-extrabold uppercase mt-1" style="color: #1a2f64;">-</p>
            </div>
          </div>

          <!-- Row 5: Lokasi -->
          <div class="pb-2.5 dashed-cyan-row flex items-center gap-4">
            <div class="cyan-icon-circle">
              <svg viewBox="0 0 24 24" class="w-6 h-6">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#ef4444"/>
                <circle cx="12" cy="9" r="2.5" fill="#ffffff"/>
              </svg>
            </div>
            <div>
              <p class="text-xs text-slate-600 font-medium leading-none">Lokasi</p>
              <p id="qrLokasi" class="text-sm sm:text-base font-extrabold uppercase mt-1" style="color: #1a2f64;">-</p>
            </div>
          </div>

          <!-- Row 6: Keterangan -->
          <div class="pb-2.5 dashed-cyan-row flex items-center gap-4">
            <div class="cyan-icon-circle">
              <svg viewBox="0 0 24 24" class="w-6 h-6">
                <circle cx="12" cy="7" r="4" fill="#0284c7"/>
                <path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2" fill="#0284c7"/>
              </svg>
            </div>
            <div>
              <p class="text-xs text-slate-600 font-medium leading-none">Keterangan</p>
              <p id="qrKeterangan" class="text-sm sm:text-base font-extrabold uppercase mt-1" style="color: #1a2f64;">-</p>
            </div>
          </div>

          <!-- Row 7: Kondisi Asset -->
          <div class="pb-1 flex items-center gap-4">
            <div class="cyan-icon-circle">
              <svg viewBox="0 0 24 24" class="w-6 h-6">
                <rect x="5" y="4" width="14" height="17" rx="2" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
                <path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1" stroke="#b45309" stroke-width="1.5"/>
                <path d="M9 13l2 2 4-4" stroke="#16a34a" stroke-width="2"/>
              </svg>
            </div>
            <div>
              <p class="text-xs text-slate-600 font-medium leading-none">Kondisi Asset</p>
              <p id="qrKondisi" class="text-sm sm:text-base font-extrabold uppercase mt-1" style="color: #1a2f64;">-</p>
            </div>
          </div>

        </div>

        <!-- KOLOM KANAN (Frame Asset Foto & Fasad Gedung DPSA) -->
        <div class="md:col-span-5 flex flex-col items-center justify-between h-full space-y-4">
          <div class="w-full flex flex-col items-center">
            <h3 class="text-lg font-black tracking-wide mb-2" style="color: #1a2f64;">Asset Foto</h3>
            
            <div class="photo-frame-cyan w-full max-w-[280px]">
              <div class="w-full rounded-[18px] overflow-hidden bg-slate-900 min-h-[220px] flex items-center justify-center">
                <img id="qrFoto" src="no image.png" alt="Asset Foto" class="w-full h-auto max-h-[260px] object-cover rounded-[16px]" onerror="this.onerror=null;this.src='no image.png';">
              </div>
            </div>
          </div>

          <!-- Ilustrasi Fasad Gedung DPSA -->
          <div class="w-full pt-2">
            <div class="w-full rounded-2xl overflow-hidden shadow-md border border-slate-200 relative bg-slate-900 min-h-[120px] flex items-end justify-center">
              <img src="building-lineart.png" alt="DPSA Building" class="w-full h-auto object-cover" onerror="this.style.display='none';">
              <img src="plant-lineart.png" alt="Plant lineart" class="absolute bottom-0 left-0 w-full h-auto pointer-events-none" onerror="this.style.display='none';">
            </div>
          </div>
        </div>

      </div>

    </div>

  </div>

  <script src="config.js"></script>
  <script src="barcode.js"></script>
</body>
</html>
